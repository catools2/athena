spring.datasource.hikari.schema=${athena.schema.name}
spring.datasource.hikari.pool-name=${athena.schema.name}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=900000

# Fail fast rather than parking a Tomcat thread for a full minute per request.
spring.datasource.hikari.connection-timeout=10000
# Probe idle connections so firewall-dropped sockets are evicted, not handed out.
spring.datasource.hikari.keepalive-time=120000
# Start in a degraded state if the DB is down instead of CrashLoopBackOff,
# which would re-storm the DB with a fresh pool on every restart.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

# pgjdbc driver properties. The previous block was MySQL Connector/J tuning
# (cachePrepStmts, useServerPrepStmts, rewriteBatchedStatements, ...) which
# pgjdbc silently ignores.
# NOTE: socketTimeout and connectTimeout are in SECONDS for pgjdbc (not milliseconds).
spring.datasource.hikari.data-source-properties.socketTimeout=60
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=250
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=5
# Server-side guards so a runaway query or an abandoned transaction cannot pin a backend.
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=60000 -c idle_in_transaction_session_timeout=120000
