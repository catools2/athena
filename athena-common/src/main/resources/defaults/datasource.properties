# Database Configuration
spring.datasource.url=jdbc:postgresql://${ATHENA_DB_HOSTNAME:localhost}:${ATHENA_DB_PORT:5432}/${ATHENA_DB_DATABASE:athena}?currentSchema=${athena.schema.name}
spring.datasource.username=${ATHENA_DB_USERNAME:athena}
spring.datasource.password=${ATHENA_DB_PASSWORD:athena}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
