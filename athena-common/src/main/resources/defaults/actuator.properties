# `prometheus` is deliberately absent: no micrometer registry is on the classpath, so
# listing it here would advertise an endpoint that does not exist. Add
# micrometer-registry-prometheus and append it if scraping is wanted.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

# Readiness includes the datasource: a pod whose Hikari pool is dead must leave the
# Service endpoints so the gateway stops routing to it.
management.endpoint.health.group.readiness.include=readinessState,db

# Liveness deliberately EXCLUDES the datasource. A DB outage must not restart every
# pod at once, which would turn a brownout into a reconnect storm.
management.endpoint.health.group.liveness.include=livenessState
