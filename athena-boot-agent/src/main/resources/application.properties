server.port=8089
spring.application.name=agent

# The agent calls the analytics REST API rather than the database. In-cluster this is the
# analytics service; locally it is the gateway or the service directly.
athena.agent.analytics.base-url=${ATHENA_ANALYTICS_URL:http://localhost:8088}
athena.agent.analytics.timeout-seconds=${ATHENA_AGENT_ANALYTICS_TIMEOUT:60}

# Chat is off unless a model is configured. The tools work regardless - an MCP client can
# drive Athena without any model credentials being present here.
athena.agent.chat.enabled=${ATHENA_AGENT_CHAT_ENABLED:false}
athena.agent.chat.api-key=${ANTHROPIC_API_KEY:}
athena.agent.chat.model=${ATHENA_AGENT_MODEL:claude-sonnet-5}
athena.agent.chat.max-tokens=${ATHENA_AGENT_MAX_TOKENS:4096}
athena.agent.chat.max-tool-iterations=${ATHENA_AGENT_MAX_TOOL_ITERATIONS:8}

# Actuator settings are spelled out here rather than imported from defaults/actuator.properties.
# That default puts the datasource in the readiness group, which is correct for the eight services
# that own one - this service owns none, and Spring Boot refuses to start when a health group
# names a contributor that does not exist. Config imported via spring.config.import overrides the
# importing document, so the import cannot simply be overridden below.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState

spring.config.import=\
  classpath:defaults/spring_fixes.properties,\
  classpath:defaults/logging.properties,\
  classpath:defaults/otel.properties,\
  classpath:defaults/spring_doc.properties
