server.port=8088
spring.application.name=analytics
athena.schema.name=athena

# This service owns no tables and runs no migrations; it reads views another service populates.
# Its only pool is the read-only one in AnalyticsDataSourceConfig, bound to athena_ro.
athena.analytics.datasource.url=jdbc:postgresql://${ATHENA_DB_HOSTNAME:localhost}:${ATHENA_DB_PORT:5432}/${ATHENA_DB_DATABASE:athena}
athena.analytics.datasource.username=${ATHENA_ANALYTICS_DB_USERNAME:athena_ro}
athena.analytics.datasource.password=${ATHENA_ANALYTICS_DB_PASSWORD:athena_ro}
athena.analytics.datasource.pool-size=${ATHENA_ANALYTICS_DB_POOL_SIZE:8}
athena.analytics.statement-timeout-ms=${ATHENA_ANALYTICS_STATEMENT_TIMEOUT_MS:30000}
athena.analytics.max-rows=${ATHENA_ANALYTICS_MAX_ROWS:50000}

spring.config.import=\
  classpath:defaults/spring_fixes.properties,\
  classpath:defaults/actuator.properties,\
  classpath:defaults/logging.properties,\
  classpath:defaults/otel.properties,\
  classpath:defaults/spring_doc.properties
