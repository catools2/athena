# Integration-test overrides.
#
# NOTE: these do not currently take effect. athena-boot-parent's <testResources> points at
# ${project.basedir}/it/resources, but every module keeps them under src/it/resources - so this
# file is never copied onto the test classpath. That affects all eight modules equally, not just
# this one; the build prints "skip non existing resourceDirectory .../it/resources" for each.
# Kept, and correct, for when that is fixed. Peers set JPA and Flyway keys here; this service excludes both
# auto-configurations outright, so there is nothing to turn off.
athena.schema.name=athena

## Logging
logging.level.org.catools.athena=warn

# The datasource is supplied by AnalyticsSpringBootIT's @DynamicPropertySource, pointing at a
# Testcontainers PostgreSQL. Nothing is set here on purpose: a hard-coded URL would win over the
# container and the tests would quietly run against whatever database happened to be listening.
