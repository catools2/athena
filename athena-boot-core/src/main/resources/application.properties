server.port=8081
spring.application.name=core
athena.schema.name=athena_core

# Service-specific database user
spring.datasource.username=${ATHENA_CORE_DB_USERNAME:athena_core_user}
spring.datasource.password=${ATHENA_CORE_DB_PASSWORD:athena_core_user}

spring.config.import=\
  classpath:defaults/spring_fixes.properties,\
  classpath:defaults/actuator.properties,\
  classpath:defaults/datasource.properties,\
  classpath:defaults/demo.properties,\
  classpath:defaults/hikari.properties,\
  classpath:defaults/jpa.properties,\
  classpath:defaults/logging.properties,\
  classpath:defaults/open_feign.properties,\
  classpath:defaults/otel.properties,\
  classpath:defaults/spring_doc.properties

# Ad-hoc read-only SQL endpoint (QueryController). Off by default: it executes
# caller-supplied SQL with no allowlist, so enabling it is a deliberate decision to
# trust every caller that can reach this service. When on, it connects as athena_ro,
# which holds only SELECT, so writes are refused by the database regardless.
athena.query.enabled=${ATHENA_QUERY_ENABLED:false}
athena.query.datasource.username=${ATHENA_QUERY_DB_USERNAME:athena_ro}
athena.query.datasource.password=${ATHENA_QUERY_DB_PASSWORD:athena_ro}
athena.query.statement-timeout-ms=${ATHENA_QUERY_STATEMENT_TIMEOUT_MS:30000}
athena.query.max-rows=${ATHENA_QUERY_MAX_ROWS:10000}

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=userByUsername,userByUsernameOrAlias,projectByCode
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=30m,recordStats
