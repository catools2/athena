# Sample override file, used by JiraConfigsTest to prove that a named HOCON config
# selected through ConfigUtils.CONFIGS_TO_LOAD actually reaches JiraConfigs.
# Site-specific custom fields belong in a file like this one, not in the defaults.
athena.jira {
  host = "https://jira.example.com"
  access_token = ${?ATHENA_JIRA_ACCESS_TOKEN}
  username = "demo-automation"
  password = ${?ATHENA_JIRA_PASSWORD}
  delay_between_calls_in_milliseconds = 500
  label_history_to_track = [
    "AIGenerated",
    "AIReviewed"
  ]
  max_response_size_in_bytes = 52428800
  issue_types = [
    "Epic",
    "Story",
    "Test",
    "Bug",
    "Task",
    "Sub-task"
  ]
  fields_to_sync = [
    "Affected Version/s",
    "Component",
    "Epic Name",
    "Epic Link",
    "Fix Version/s",
    "IssueLink",
    "Label",
    "Parent",
    "Team"
  ]
}
